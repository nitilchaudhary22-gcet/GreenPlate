{% extends "base.html" %}

{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <span class="fs-1">🌱</span>
                            <h2 class="fw-bold text-dark mt-2">Create an Account</h2>
                            <p class="text-muted">Join GreenPlate to reduce food waste</p>
                        </div>
                        {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                        <form method="POST" action="{{ url_for('register') }}">
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control form-control-lg rounded-3" id="fullName" name="full_name" placeholder="Enter your full name" required>
                            </div>
                            <div class="mb-3">
                                <label for="registerEmail" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control form-control-lg rounded-3" id="registerEmail" name="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="registerPassword" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg rounded-3" id="registerPassword" name="password" placeholder="••••••••" required>
                            </div>
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" class="form-control form-control-lg rounded-3" id="confirmPassword" placeholder="••••••••" required>
                            </div>
                            <input type="hidden" name="role" value="user">
                            <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill shadow-sm fw-bold mb-3">Register</button>
                        </form>
                        <div class="text-center mt-3">
                            <p class="text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
