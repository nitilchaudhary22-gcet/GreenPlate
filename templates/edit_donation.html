{% extends "base.html" %}

{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Edit Form Card -->
                <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <span class="fs-1">✏️</span>
                            <h2 class="fw-bold text-dark mt-2">Edit Donation</h2>
                            <p class="text-muted">Update your surplus food listing.</p>
                        </div>
                        
                        <!-- Show any backend validation error messages here -->
                        {% if error %}
                        <div class="alert alert-danger" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                        
                        <form method="POST" action="{{ url_for('edit_restaurant_donation', donation_id=donation.id) }}">
                            <!-- Food Name Field -->
                            <div class="mb-3">
                                <label for="foodName" class="form-label fw-semibold">Food Name</label>
                                <input type="text" class="form-control form-control-lg rounded-3" id="foodName" name="food_name" value="{{ donation.food_name }}" required>
                            </div>
                            
                            <!-- Quantity Field -->
                            <div class="mb-3">
                                <label for="quantity" class="form-label fw-semibold">Quantity (Meals/Portions)</label>
                                <input type="number" class="form-control form-control-lg rounded-3" id="quantity" name="quantity" min="1" value="{{ donation.quantity }}" required>
                            </div>
                            
                            <!-- Expiry Time Field -->
                            <div class="mb-3">
                                <label for="expiryTime" class="form-label fw-semibold">Best Before / Expiry Time</label>
                                <!-- Format the datetime value for HTML5 datetime-local input -->
                                <input type="datetime-local" class="form-control form-control-lg rounded-3" id="expiryTime" name="expiry_time" value="{{ donation.expiry_time.strftime('%Y-%m-%dT%H:%M') }}" required>
                            </div>
                            
                            <!-- Optional Description Field -->
                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold">Description (Optional)</label>
                                <textarea class="form-control rounded-3" id="description" name="description" rows="3">{{ donation.description or '' }}</textarea>
                            </div>
                            
                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm fw-bold">Update Donation</button>
                        </form>
                        
                        <!-- Back link to My Donations -->
                        <div class="text-center mt-4">
                            <a href="{{ url_for('restaurant_my_donations') }}" class="text-muted text-decoration-none fw-semibold">
                                &larr; Back to My Donations
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
